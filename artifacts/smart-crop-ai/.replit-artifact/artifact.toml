kind = "web"
previewPath = "/"
title = "Smart Crop AI"
version = "1.0.0"
id = "artifacts/smart-crop-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20469

[services.development]
run = "pnpm --filter @workspace/smart-crop-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-crop-ai", "run", "build" ]
publicDir = "artifacts/smart-crop-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20469"
BASE_PATH = "/"
